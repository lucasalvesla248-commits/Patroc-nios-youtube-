<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrocinadores — IRL Pro</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
#logo{
  position:absolute;
  right:0;
  bottom:0;
  width:min(31vw,420px);
  max-width:44%;
  opacity:0;
  transform:translateY(10px) scale(.97);
  transition:opacity .7s ease, transform .7s ease;
}
#logo.show{opacity:1;transform:translateY(0) scale(1)}
</style>
</head>
<body>
<img id="logo" alt="">
<script>
const logo=document.getElementById('logo');
const explorando='explorando_felicidades_todo_branco.png';
const conecta='conecta_piaui_patrocinador_starlink.png';
const CYCLE=56000, SHOW1=8000, SHOW2=8000;

function update(){
  const t=performance.now()%CYCLE;
  if(t<SHOW1){
    if(logo.dataset.src!==explorando){
      logo.classList.remove('show');
      setTimeout(()=>{logo.src=explorando;logo.dataset.src=explorando;logo.classList.add('show')},80);
    }else logo.classList.add('show');
  }else if(t<SHOW1+SHOW2){
    if(logo.dataset.src!==conecta){
      logo.classList.remove('show');
      setTimeout(()=>{logo.src=conecta;logo.dataset.src=conecta;logo.classList.add('show')},80);
    }else logo.classList.add('show');
  }else{
    logo.classList.remove('show');
    logo.dataset.src='';
  }
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
