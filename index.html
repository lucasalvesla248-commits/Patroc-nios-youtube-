<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrocinadores — IRL Pro</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
#stage{position:relative;width:100%;height:100%}
.logo{position:absolute;right:3.5%;width:min(31vw,420px);max-width:44%;opacity:0}
#explorando{bottom:15%;animation:showThenWait 48s infinite}
#conecta{bottom:4%;animation:showThenWait 48s infinite}
@keyframes showThenWait{
  0%{opacity:0;transform:translateY(12px) scale(.96)}
  4%{opacity:1;transform:translateY(0) scale(1)}
  14%{opacity:1;transform:translateY(0) scale(1)}
  18%{opacity:0;transform:translateY(-8px) scale(1.02)}
  100%{opacity:0;transform:translateY(-8px) scale(1.02)}
}
</style>
</head>
<body>
<div id="stage">
  <img id="explorando" class="logo" src="explorando_felicidades_todo_branco.png" alt="">
  <img id="conecta" class="logo" src="conecta_piaui_patrocinador_starlink.png" alt="">
</div>
</body>
</html>
