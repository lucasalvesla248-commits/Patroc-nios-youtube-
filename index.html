<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrocinadores — IRL Pro</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
.logo{position:absolute;right:3.5%;width:min(31vw,420px);max-width:44%;opacity:0}
#explorando{bottom:15%;animation:exp 56s infinite}
#conecta{bottom:15%;animation:con 56s infinite}

@keyframes exp{
  0%{opacity:0;transform:translateY(12px) scale(.96)}
  1.8%{opacity:1;transform:translateY(0) scale(1)}
  12.5%{opacity:1;transform:translateY(0) scale(1)}
  14.3%{opacity:0;transform:translateY(-8px) scale(1.02)}
  100%{opacity:0;transform:translateY(-8px) scale(1.02)}
}
@keyframes con{
  0%,14.3%{opacity:0;transform:translateY(12px) scale(.96)}
  16.1%{opacity:1;transform:translateY(0) scale(1)}
  26.8%{opacity:1;transform:translateY(0) scale(1)}
  28.6%{opacity:0;transform:translateY(-8px) scale(1.02)}
  100%{opacity:0;transform:translateY(-8px) scale(1.02)}
}
</style>
</head>
<body>
<img id="explorando" class="logo" src="explorando_felicidades_todo_branco.png" alt="">
<img id="conecta" class="logo" src="conecta_piaui_patrocinador_starlink.png" alt="">
</body>
</html>
