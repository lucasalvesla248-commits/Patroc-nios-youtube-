<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IRL Pro — Patrocinadores + Telemetria</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
#stage{position:fixed;inset:0;width:100%;height:100%;background:transparent}

#group{
  position:absolute;
  left:30px;
  bottom:calc(min(265px,34vh) + 10px);
  width:min(320px,27vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);
}

#location{
  position:absolute;
  left:30px;
  top:22px;
  width:min(760px,70vw);
  font-size:24px;
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:left;
}

#speed{
  position:absolute;
  left:30px;
  top:53px;
  font-size:30px;
  font-weight:800;
  line-height:1.05;
  text-align:left;
}

#logo{
  width:min(255px,100%);
  max-width:255px;
  height:auto;
  display:block;
  opacity:0;
  transform:translateY(8px) scale(.98);
  transition:opacity .65s ease,transform .65s ease;
  pointer-events:none;
}

#telemetry{
  margin-top:4px;
  font-size:24px;
  font-weight:800;
  line-height:1.1;
  white-space:nowrap;
  letter-spacing:.2px;
}

#logo.show{opacity:1;transform:translateY(0) scale(1)}
</style>
</head>
<body>
<div id="stage">
  <div id="location">Obtendo localização…</div>
  <div id="speed">0 km/h</div>
  <div id="group">
    <img id="logo" alt="">
    <div id="telemetry"><span id="time">--:--</span>&nbsp;&nbsp;<span id="temp">--°C</span></div>
  </div>
</div>

<script>
const logo=document.getElementById('logo');
const timeEl=document.getElementById('time');
const tempEl=document.getElementById('temp');
const locationEl=document.getElementById('location');
const speedEl=document.getElementById('speed');

const explorando='explorando_felicidades_todo_branco.png';
const conecta='conecta_piaui_patrocinador_starlink.png';

const SHOW=8000;
const BLANK=40000;
const CYCLE=SHOW+SHOW+BLANK;
let current='';

function setLogo(src, visible){
  if(visible){
    if(current!==src){
      logo.classList.remove('show');
      setTimeout(()=>{
        logo.src=src;
        current=src;
        logo.classList.add('show');
      },120);
    }else logo.classList.add('show');
  }else{
    logo.classList.remove('show');
    current='';
  }
}

function loop(){
  const t=performance.now()%CYCLE;
  if(t<SHOW) setLogo(explorando,true);
  else if(t<SHOW+SHOW) setLogo(conecta,true);
  else setLogo('',false);
  requestAnimationFrame(loop);
}

function clock(){
  timeEl.textContent=new Date().toLocaleTimeString('pt-BR',{
    hour:'2-digit',minute:'2-digit',hour12:false
  });
}
clock();
setInterval(clock,1000);

let lastLat=null,lastLon=null,lastWeather=0,lastReverse=0;

async function updateTemperature(lat,lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(j.current?.temperature_2m!=null)
      tempEl.textContent=Math.round(j.current.temperature_2m)+'°C';
  }catch(e){}
}

async function updateLocation(lat,lon){
  const now=Date.now();
  if(now-lastReverse<30000)return;
  lastReverse=now;
  try{
    const url=`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`;
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    const city=j.city || j.locality || j.principalSubdivision || '';
    const state=j.principalSubdivision || '';
    const text=city && state && city!==state ? `${city}, ${state}` : (city || state || 'Localização indisponível');
    locationEl.textContent=text;
    locationEl.title=text;
  }catch(e){
    locationEl.textContent='Localização indisponível';
  }
}

function positionSuccess(pos){
  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;
  let kmh=0;
  if(typeof pos.coords.speed==='number' && pos.coords.speed>=0)
    kmh=pos.coords.speed*3.6;
  speedEl.textContent=(kmh<10 ? kmh.toFixed(1) : Math.round(kmh))+' km/h';

  updateLocation(lat,lon);
  if(Date.now()-lastWeather>60000){
    lastWeather=Date.now();
    updateTemperature(lat,lon);
  }
}

function positionError(){
  locationEl.textContent='Localização indisponível';
}

if(navigator.geolocation){
  navigator.geolocation.watchPosition(positionSuccess,positionError,{
    enableHighAccuracy:true,
    maximumAge:5000,
    timeout:15000
  });
}else{
  positionError();
}

loop();
</script>
</body>
</html>
