<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patrocinadores + Hora + Temperatura — IRL Pro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
#stage{position:fixed;inset:0;width:100%;height:100%;background:transparent}

#group{
  position:absolute;
  left:30px;
  bottom:calc(min(265px,34vh) + 12px);
  width:min(300px,24vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#logo{
  width:100%;
  max-width:300px;
  height:auto;
  display:block;
  opacity:0;
  transform:translateY(8px) scale(.98);
  transition:opacity .65s ease,transform .65s ease;
  pointer-events:none;
}

#telemetry{
  margin-top:4px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:19px;
  font-weight:700;
  line-height:1.15;
  color:#fff;
  white-space:nowrap;
  text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);
  letter-spacing:.2px;
}

#logo.show{opacity:1;transform:translateY(0) scale(1)}
</style>
</head>
<body>
<div id="stage">
  <div id="group">
    <img id="logo" alt="">
    <div id="telemetry"><span id="time">--:--</span>&nbsp;&nbsp;<span id="temp">--°C</span></div>
  </div>
</div>

<script>
const logo=document.getElementById('logo');
const timeEl=document.getElementById('time');
const tempEl=document.getElementById('temp');

const explorando='explorando_felicidades_todo_branco.png';
const conecta='conecta_piaui_patrocinador_starlink.png';

const SHOW=8000;
const BLANK=40000;
const CYCLE=SHOW+SHOW+BLANK;

let current='';

function setLogo(src, visible){
  if(visible){
    if(current!==src){
      logo.classList.remove('show');
      setTimeout(()=>{
        logo.src=src;
        current=src;
        logo.classList.add('show');
      },120);
    }else logo.classList.add('show');
  }else{
    logo.classList.remove('show');
    current='';
  }
}

function loop(){
  const t=performance.now()%CYCLE;
  if(t<SHOW) setLogo(explorando,true);
  else if(t<SHOW+SHOW) setLogo(conecta,true);
  else setLogo('',false);
  requestAnimationFrame(loop);
}

function clock(){
  const now=new Date();
  timeEl.textContent=now.toLocaleTimeString('pt-BR',{
    hour:'2-digit',minute:'2-digit',hour12:false
  });
}
clock();
setInterval(clock,1000);

async function updateTemperature(lat,lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(j.current && j.current.temperature_2m!=null){
      tempEl.textContent=Math.round(j.current.temperature_2m)+'°C';
    }
  }catch(e){}
}

function getWeather(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(
    p=>updateTemperature(p.coords.latitude,p.coords.longitude),
    ()=>{},
    {enableHighAccuracy:true,maximumAge:60000,timeout:15000}
  );
}
getWeather();
setInterval(getWeather,60000);

loop();
</script>
</body>
</html>
